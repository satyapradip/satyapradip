<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a">
        <animate attributeName="stop-color" values="#0a0a0a;#111111;#0a0a0a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#111111">
        <animate attributeName="stop-color" values="#111111;#161b22;#111111" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a1a2e">
        <animate attributeName="stop-color" values="#1a1a2e;#132030;#1a1a2e" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <path fill="url(#waveGrad)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
        M0,190 C200,160 400,210 600,185 C800,160 1000,205 1200,180 L1200,220 L0,220 Z;
        M0,180 C200,205 400,160 600,190 C800,215 1000,165 1200,195 L1200,220 L0,220 Z;
        M0,190 C200,160 400,210 600,185 C800,160 1000,205 1200,180 L1200,220 L0,220 Z
      "/>
  </path>

  <text x="600" y="98" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" font-size="54" font-weight="700" fill="#e2e8f0" letter-spacing="1">
    Satyapradip Das
  </text>

  <text x="600" y="140" text-anchor="middle" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" font-size="19" fill="#64748b" letter-spacing="0.5">
    Full-Stack Developer &#8226; Backend &amp; API Design &#8226; AI Integrations
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
